name: Etched Sohu (transformer-only ASIC)
vendor: etched
gen: transformer-asic
# Sohu is a transformer-only ASIC, claimed by Etched at ~144× H100 throughput
# for transformer inference. Numbers here are rough estimates — the chip is
# specialized and many of vram-budget's general-purpose assumptions don't
# apply (e.g. no flexibility for non-transformer ops).
vram_gb: 144.0              # claimed HBM3
bf16_tflops: 500.0          # very approximate; Sohu's strength is fp8 throughput
fp8_tflops: 5000.0
multi: { num_gpus: 1, parallelism: single }
safety_buffer_gb: 2.0
