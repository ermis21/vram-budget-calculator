name: openai/gpt-oss-120b  (MoE)
family: transformer-decoder

# OpenAI's gpt-oss-120b: 117B total, ~5.1B active. 128 experts, top-4 active.
# Released with native MXFP4 weights.
vocab: { size: 200000, tied_embeddings: false, ple: { enabled: false } }
hidden_size: 2880
num_hidden_layers: 36

ffn:
  kind: gated_silu
  intermediate_size: 8192
  moe:
    enabled: true
    num_experts: 128
    num_active_experts: 4
    expert_intermediate_size: 2880
    num_shared_experts: 0
    router_bytes_per_param: 2.0

attention:
  pattern: full
  num_attention_heads: 64
  num_key_value_heads: 8
  head_dim: 64
  rope: { base_swa: 150000.0 }
