name: Qwen/Qwen3-235B-A22B  (MoE)
family: transformer-decoder

# Qwen3 large MoE: 128 routed experts, top-8 active, no shared expert.
# ~235B total params, ~22B active.
vocab:
  size: 151936
  tied_embeddings: false
  ple: { enabled: false }

hidden_size: 4096
num_hidden_layers: 94

ffn:
  kind: gated_silu
  intermediate_size: 12288        # ignored under MoE
  moe:
    enabled: true
    num_experts: 128
    num_active_experts: 8
    expert_intermediate_size: 1536
    num_shared_experts: 0
    router_bytes_per_param: 2.0

attention:
  pattern: full
  num_attention_heads: 64
  num_key_value_heads: 4
  head_dim: 128
  rope: { base_swa: 1000000.0 }
release_date: 2025-04-29
