# Gemma-style hybrid SWA+global template (no fixed sizes).
#
# Exercises every advanced feature the calculator supports: hybrid attention
# (5 SWA per 1 global), dual RoPE bases, and optional Per-Layer Embeddings
# (PLE). Sweep dimensions with --focal/--free.
name: gemma-hybrid-style-template
family: transformer-decoder

vocab:
  size: 256000
  tied_embeddings: true
  ple:
    enabled: false          # flip to true to model Gemma-3n / 4 PLE
    dim: 256

hidden_size: 2048
num_hidden_layers: 24

ffn:
  kind: gated_silu
  ffn_ratio: 4.0
  moe: { enabled: false }

attention:
  pattern: hybrid
  num_attention_heads: 32
  num_key_value_heads: 16
  head_dim: 128
  global_head_dim: null     # same as head_dim (set to e.g. 256 for hybrid head_dim)
  sliding_window: 1024
  swa_global_ratio: 5       # 5 SWA per 1 global; final layer always global
  num_kv_shared_layers: 0
  rope:
    base_swa: 10000.0
    base_global: 1000000.0
