name: meta-llama/Llama-4-Scout-17B-16E  (MoE)
family: transformer-decoder

# Llama 4 Scout: ~109B total, ~17B active. 16 routed experts + 1 shared
# expert that's always-on (top-1 routing).
vocab: { size: 202048, tied_embeddings: false, ple: { enabled: false } }
hidden_size: 5120
num_hidden_layers: 48

ffn:
  kind: gated_silu
  intermediate_size: 16384       # ignored under MoE
  moe:
    enabled: true
    num_experts: 16
    num_active_experts: 1
    expert_intermediate_size: 8192
    num_shared_experts: 1
    router_bytes_per_param: 2.0

attention:
  pattern: full
  num_attention_heads: 40
  num_key_value_heads: 8
  head_dim: 128
  rope: { base_swa: 500000.0 }
