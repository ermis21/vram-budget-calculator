name: meta-llama/Llama-4-Maverick-17B-128E  (MoE)
family: transformer-decoder

# Llama 4 Maverick: ~400B total, ~17B active. 128 routed experts + 1 shared
# expert that's always-on (DeepSeek-style fine-grained MoE).
vocab: { size: 202048, tied_embeddings: false, ple: { enabled: false } }
hidden_size: 5120
num_hidden_layers: 48

ffn:
  kind: gated_silu
  intermediate_size: 16384       # ignored under MoE
  moe:
    enabled: true
    num_experts: 128
    num_active_experts: 1        # top-1 routing in Maverick
    expert_intermediate_size: 4096    # tuned to land near published 400B total
    num_shared_experts: 1
    router_bytes_per_param: 2.0

attention:
  pattern: full
  num_attention_heads: 40
  num_key_value_heads: 8
  head_dim: 128
  rope: { base_swa: 500000.0 }
