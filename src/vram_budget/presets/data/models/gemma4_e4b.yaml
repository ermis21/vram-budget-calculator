name: google/gemma-4-e4b  (PLE-enabled "effective-4B")
family: transformer-decoder

# Specs estimated from the public Gemma-3n / Gemma-4 family pattern.
# Adjust hidden_size / num_hidden_layers / intermediate_size if the released
# config differs from this guess.
vocab:
  size: 262144
  tied_embeddings: true
  ple:
    enabled: true
    dim: 256

hidden_size: 3072
num_hidden_layers: 40

ffn:
  kind: gated_silu
  intermediate_size: 12288
  moe: { enabled: false }

attention:
  pattern: hybrid
  num_attention_heads: 8
  num_key_value_heads: 2
  head_dim: 256
  global_head_dim: null
  sliding_window: 1024
  swa_global_ratio: 5
  num_kv_shared_layers: 4
  rope:
    base_swa: 10000.0
    base_global: 1000000.0
release_date: 2026-02-19
