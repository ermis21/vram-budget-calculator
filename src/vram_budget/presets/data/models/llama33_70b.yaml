name: meta-llama/Llama-3.3-70B-Instruct
family: transformer-decoder

# Llama 3.3 70B uses the same architecture as Llama 3.1 70B; the changes are
# in training data and instruction-tuning. Memory math is identical.
vocab: { size: 128256, tied_embeddings: false, ple: { enabled: false } }
hidden_size: 8192
num_hidden_layers: 80

ffn:
  kind: gated_silu
  intermediate_size: 28672
  moe: { enabled: false }

attention:
  pattern: full
  num_attention_heads: 64
  num_key_value_heads: 8
  head_dim: 128
  rope: { base_swa: 500000.0 }
release_date: 2024-12-06
