name: meta-llama/Meta-Llama-3.1-8B
family: transformer-decoder

vocab: { size: 128256, tied_embeddings: false, ple: { enabled: false } }
hidden_size: 4096
num_hidden_layers: 32

ffn:
  kind: gated_silu
  intermediate_size: 14336
  moe: { enabled: false }

attention:
  pattern: full                    # 128k context via YaRN scaling, not SWA
  num_attention_heads: 32
  num_key_value_heads: 8
  head_dim: 128
  rope: { base_swa: 500000.0 }
