name: meta-llama/Llama-2-70b
family: transformer-decoder

vocab: { size: 32000, tied_embeddings: false, ple: { enabled: false } }
hidden_size: 8192
num_hidden_layers: 80

ffn:
  kind: gated_silu
  intermediate_size: 28672
  moe: { enabled: false }

attention:
  pattern: full
  num_attention_heads: 64
  num_key_value_heads: 8           # GQA 8:1
  head_dim: 128
  rope: { base_swa: 10000.0 }
