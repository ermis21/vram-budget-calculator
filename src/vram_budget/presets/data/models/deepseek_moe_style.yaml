# DeepSeek-V2-style MoE template: fine-grained experts + always-on shared
# experts. Smaller per-expert FFN than dense → sweep num_experts to see the
# total/active-params trade-off cleanly.
name: deepseek-moe-style-template
family: transformer-decoder

vocab: { size: 102400, tied_embeddings: false, ple: { enabled: false } }
hidden_size: 2048
num_hidden_layers: 27

ffn:
  kind: gated_silu
  intermediate_size: 10944      # ignored when MoE is on
  moe:
    enabled: true
    num_experts: 64
    num_active_experts: 6
    expert_intermediate_size: 1408     # fine-grained: smaller per-expert FFN
    num_shared_experts: 2              # DeepSeek-style always-on shared experts
    router_bytes_per_param: 2.0

attention:
  pattern: full
  num_attention_heads: 16
  num_key_value_heads: 16
  head_dim: 128
  rope: { base_swa: 10000.0 }
