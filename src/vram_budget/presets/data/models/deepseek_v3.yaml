name: deepseek-ai/DeepSeek-V3  (MoE, MLA)
family: transformer-decoder

# DeepSeek-V3: 671B total, 37B active. 256 routed experts + 1 shared expert.
# Real architecture uses Multi-head Latent Attention (MLA), which compresses
# the KV cache; this calculator approximates by treating it as full attention,
# so the KV-cache numbers will be CONSERVATIVE (over-estimates) for V3.
vocab: { size: 129280, tied_embeddings: false, ple: { enabled: false } }
hidden_size: 7168
num_hidden_layers: 61

ffn:
  kind: gated_silu
  intermediate_size: 18432       # ignored under MoE
  moe:
    enabled: true
    num_experts: 256
    num_active_experts: 8
    expert_intermediate_size: 2048
    num_shared_experts: 1
    router_bytes_per_param: 2.0

attention:
  pattern: full
  num_attention_heads: 128
  num_key_value_heads: 128       # MLA-equivalent; calculator over-estimates KV here
  head_dim: 128
  rope: { base_swa: 10000.0 }
