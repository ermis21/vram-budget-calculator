name: google/gemma-4-e2b  (PLE-enabled "effective-2B")
family: transformer-decoder

# Gemma 4 (and 3n) introduces Per-Layer Embeddings (PLE) — a separate
# vocab × L × ple_dim table mixed in per layer. The "effective" param count
# (ratio of active params to embedding-table params) is a Gemma-4 metric;
# this preset captures the actual storage footprint.
vocab:
  size: 262144
  tied_embeddings: true
  ple:
    enabled: true
    dim: 256

hidden_size: 2048
num_hidden_layers: 30

ffn:
  kind: gated_silu
  intermediate_size: 8192        # ~4× hidden
  moe: { enabled: false }

attention:
  pattern: hybrid
  num_attention_heads: 8
  num_key_value_heads: 2          # MQA-like 4:1 GQA
  head_dim: 256
  global_head_dim: null
  sliding_window: 1024
  swa_global_ratio: 5
  num_kv_shared_layers: 4         # last 4 layers reuse upstream K,V (Gemma 4 trick)
  rope:
    base_swa: 10000.0
    base_global: 1000000.0
