name: google/gemma-3-27b
family: transformer-decoder

vocab:
  size: 256000
  tied_embeddings: true
  ple:
    enabled: false   # PLE introduced in Gemma 3n / 4 family; the 27B base does not use it

hidden_size: 5376
num_hidden_layers: 62

ffn:
  kind: gated_silu
  intermediate_size: 21504
  moe:
    enabled: false

attention:
  pattern: hybrid
  num_attention_heads: 32
  num_key_value_heads: 16
  head_dim: 128
  global_head_dim: null    # same as head_dim
  sliding_window: 1024
  swa_global_ratio: 5      # 5 SWA per 1 global; final layer global
  rope:
    base_swa: 10000.0
    base_global: 1000000.0
