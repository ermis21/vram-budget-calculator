name: Qwen/Qwen3-30B-A3B  (MoE)
family: transformer-decoder

# Qwen3 fine-grained MoE: 128 routed experts, top-8 active, no shared expert.
# ~30B total params, ~3B active.
vocab:
  size: 151936
  tied_embeddings: false
  ple: { enabled: false }

hidden_size: 2048
num_hidden_layers: 48

ffn:
  kind: gated_silu
  intermediate_size: 6144         # ignored when MoE is on
  moe:
    enabled: true
    num_experts: 128
    num_active_experts: 8
    expert_intermediate_size: 768
    num_shared_experts: 0
    router_bytes_per_param: 2.0

attention:
  pattern: full
  num_attention_heads: 32
  num_key_value_heads: 4
  head_dim: 128
  rope: { base_swa: 1000000.0 }
release_date: 2025-04-29
