name: google/gemma-4-27b
family: transformer-decoder

# Larger Gemma-4 base (PLE on, dense FFN). Gemma-4 27B keeps the hybrid
# 5:1 SWA:global pattern from Gemma-3 but adds PLE. The "27B" headline
# refers to body params; the storage footprint with PLE is ~31B due to the
# vocab × L × ple_dim table (~4B extra at vocab=262144, L=62, ple_dim=256).
vocab:
  size: 262144
  tied_embeddings: true
  ple:
    enabled: true
    dim: 256

hidden_size: 5376
num_hidden_layers: 62

ffn:
  kind: gated_silu
  intermediate_size: 21504
  moe: { enabled: false }

attention:
  pattern: hybrid
  num_attention_heads: 32
  num_key_value_heads: 16
  head_dim: 128
  global_head_dim: null
  sliding_window: 1024
  swa_global_ratio: 5
  num_kv_shared_layers: 4
  rope:
    base_swa: 10000.0
    base_global: 1000000.0
