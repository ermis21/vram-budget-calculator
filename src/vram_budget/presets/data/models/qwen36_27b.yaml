name: "Qwen/Qwen3.6-27B  (hybrid gated-attention + DeltaNet)"
family: transformer-decoder

# Released April 22, 2026. Hybrid architecture: 64 layers in a 3:1 pattern
# of (linear_attention, linear_attention, linear_attention, full_attention).
# - "full_attention" layers (16): standard softmax attention with Gated Attn,
#   24 Q heads / 4 KV heads, head_dim=256, partial_rotary 25%.
# - "linear_attention" layers (48): Gated DeltaNet — fixed-size state, not
#   sequence-dependent. We approximate them with a tiny sliding_window so the
#   per-token KV math reflects DeltaNet's near-constant footprint.
# Multimodal config (vision tower) is NOT modeled here; vocab includes the
# vision tokens (248,320).
vocab:
  size: 248320
  tied_embeddings: false
  ple: { enabled: false }

hidden_size: 5120
num_hidden_layers: 64

ffn:
  kind: gated_silu
  intermediate_size: 17408
  moe: { enabled: false }

attention:
  pattern: hybrid
  num_attention_heads: 24
  num_key_value_heads: 4
  head_dim: 256
  global_head_dim: null
  # 48 linear-attention layers approximated as SWA with a tiny window —
  # DeltaNet keeps a fixed-size state regardless of seq_len, so the
  # equivalent "effective KV span" is small. sliding_window=64 is a
  # conservative over-estimate for the linear layers.
  sliding_window: 64
  swa_global_ratio: 3              # period 4 → every 4th layer is full attention (16 of 64)
  num_kv_shared_layers: 0
  rope:
    base_swa: 10000000.0           # rope_theta = 1e7 in the config
    base_global: 10000000.0
release_date: 2025-12-03
