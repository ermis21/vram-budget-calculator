# Mixtral-style MoE template (full attention, top-k routing, no shared experts).
#
# Sweep MoE knobs with --focal:
#
#   vram-budget frontier --gpu h100_80gb --arch-template mixtral_moe_style \
#     --focal ffn.moe.num_experts --values 4,8,16,32 \
#     --free 'num_hidden_layers=24,32,40'
name: mixtral-moe-style-template
family: transformer-decoder

vocab: { size: 32000, tied_embeddings: false, ple: { enabled: false } }
hidden_size: 4096
num_hidden_layers: 32

ffn:
  kind: gated_silu
  intermediate_size: 14336      # ignored when MoE is on; required by schema
  moe:
    enabled: true
    num_experts: 8
    num_active_experts: 2
    expert_intermediate_size: 14336
    num_shared_experts: 0
    router_bytes_per_param: 2.0

attention:
  pattern: full
  num_attention_heads: 32
  num_key_value_heads: 8
  head_dim: 128
  rope: { base_swa: 1000000.0 }
