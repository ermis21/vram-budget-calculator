name: deepseek-ai/DeepSeek-V2-Lite
family: transformer-decoder

# DeepSeek-V2-Lite (~16B total / ~2.4B active) — a useful target because the full
# DeepSeek-V2 / V3 use Multi-head Latent Attention (MLA), which we approximate
# here with full attention for memory-budget purposes (MLA reduces KV-cache size,
# not param count meaningfully).
vocab: { size: 102400, tied_embeddings: false, ple: { enabled: false } }
hidden_size: 2048
num_hidden_layers: 27

ffn:
  kind: gated_silu
  intermediate_size: 10944         # ignored under MoE
  moe:
    enabled: true
    num_experts: 64
    num_active_experts: 6
    expert_intermediate_size: 1408
    num_shared_experts: 2
    router_bytes_per_param: 2.0

attention:
  pattern: full
  num_attention_heads: 16
  num_key_value_heads: 16
  head_dim: 128
  rope: { base_swa: 10000.0 }
release_date: 2024-05-07
