name: meta-llama/Llama-2-7b
family: transformer-decoder

vocab: { size: 32000, tied_embeddings: false, ple: { enabled: false } }
hidden_size: 4096
num_hidden_layers: 32

ffn:
  kind: gated_silu
  intermediate_size: 11008
  moe: { enabled: false }

attention:
  pattern: full
  num_attention_heads: 32
  num_key_value_heads: 32         # MHA, not GQA
  head_dim: 128
  rope: { base_swa: 10000.0 }
release_date: 2023-07-18
